; NextAutoDesk supervisord configuration
; =============================================================================
; Runs as the unprivileged user "nad" (the container's USER). Supervises three
; long-lived processes, started in priority order:
;
;   xvfb (10)  virtual X server on $DISPLAY
;   xfce (20)  XFCE session (xfwm4 + xfdesktop + panel) in a private D-Bus session
;   api  (30)  FastAPI service: python -m nextautodesk serve
;
; Every program auto-restarts on crash; stop signals are sent to the whole
; process group so child processes (dbus-daemon, xfwm4, ...) are not orphaned.
;
; Environment variables referenced below are exported by docker/entrypoint.sh:
;   DISPLAY, NAD_SCREEN_SIZE, NAD_DPI, NEXT_AUTODESK_CONFIG, NEXT_AUTODESK_DATA_DIR
; =============================================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/data/logs
minfds=1024
minprocs=200
strip_ansi=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Optional extra programs (only populated when the image is built with
; INSTALL_VNC=true: x11vnc). The glob is empty by default.
[include]
files = /opt/nad/conf.d/*.conf

; -----------------------------------------------------------------------------
; Virtual X server
; -----------------------------------------------------------------------------
[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_NAD_SCREEN_SIZE)s -nolisten tcp -dpi %(ENV_NAD_DPI)s
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/xvfb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

; -----------------------------------------------------------------------------
; XFCE desktop session (window manager, desktop, panel)
; -----------------------------------------------------------------------------
[program:xfce]
command=/opt/nad/start-xfce.sh
priority=20
autostart=true
autorestart=true
startsecs=10
startretries=20
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/xfce.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

; -----------------------------------------------------------------------------
; HTTP API
;
; The API process also writes rotating structured logs to
; $NEXT_AUTODESK_DATA_DIR/logs/nextautodesk.log; this supervisor capture is the
; fallback for interpreter/uvicorn output emitted outside the logging setup
; (startup tracebacks, fatal errors). An explicit file name is used so the log
; file is stable instead of supervisor's AUTO-generated name.
; -----------------------------------------------------------------------------
[program:api]
command=/opt/nad/start-api.sh
; pyscreeze's scrot backend writes its temporary screenshot into the current
; directory; /data is the writable volume (supervisord itself runs from /app,
; which is deliberately read-only for the "nad" user).
directory=/data
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
